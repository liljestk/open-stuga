name: CI (manual hosted fallback)

on:
  workflow_dispatch:
    inputs:
      confirm_hosted_run:
        description: Confirm use of paid GitHub-hosted runners
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  portable-local:
    name: Local mode (${{ matrix.os }})
    if: ${{ inputs.confirm_hosted_run }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test portable setup and backup tooling
        run: npm run test:setup && npm run test:data-safety

      - name: Build native local mode
        run: npm run build

  ios-companion:
    name: Native iOS companion
    if: ${{ inputs.confirm_hosted_run }}
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Test portable Swift core
        run: swift test --package-path apps/ios

      - name: Build iOS app
        run: >-
          xcodebuild
          -project apps/ios/Stugu.xcodeproj
          -scheme Stugu
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/stugu-ios-derived-data"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Build Mac Catalyst app
        run: >-
          xcodebuild
          -project apps/ios/Stugu.xcodeproj
          -scheme Stugu
          -destination 'platform=macOS,variant=Mac Catalyst'
          -derivedDataPath "$RUNNER_TEMP/stugu-catalyst-derived-data"
          CODE_SIGNING_ALLOWED=NO
          build

  host-updater-native:
    name: Signed host updater (Debian Trixie native gate)
    if: ${{ inputs.confirm_hosted_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Verify a signed RAUC publication through TUF over HTTPS
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /workspace \
            debian:trixie-slim@sha256:020c0d20b9880058cbe785a9db107156c3c75c2ac944a6aa7ab59f2add76a7bd \
            bash -lc '
              set -euo pipefail
              apt-get update >/dev/null
              DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
                ca-certificates openssl python3-cryptography python3-securesystemslib \
                python3-tuf rauc squashfs-tools >/dev/null
              python3 scripts/tests/host-publication-e2e.py
            '

      - name: Exercise Linux-only updater durability and process safety
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --init \
            --entrypoint sh \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --tmpfs /workspace/data:rw,exec,mode=1777 \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --workdir /workspace \
            docker:28-cli@sha256:625d9431a9f54c5a2bc90f24f0e1c3d55b1349fd857dd85035f98c2c9acbdd4d \
            -lc '
              set -euo pipefail
              apk add --no-cache nodejs >/dev/null
              node --test \
                scripts/tests/system-update-agent.test.mjs \
                scripts/tests/host-update-agent-interlock.test.mjs \
                scripts/tests/update-agent-process-safety.test.mjs \
                scripts/tests/update-agent-service.test.mjs \
                scripts/tests/source-profile-agent.test.mjs \
                scripts/tests/storage-agent.test.mjs
            '

  validate:
    if: ${{ inputs.confirm_hosted_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/python/requirements*.txt

      - name: Install dependencies
        run: npm ci

      - name: Install TP-Link bridge test dependencies
        run: python -m pip install -r apps/api/python/requirements.txt -r apps/api/python/requirements-dev.txt

      - name: Check release version consistency
        run: npm run version:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint Python components
        run: >-
          python -m ruff check apps/api/python apps/api/python_tests
          deploy/rpi/host-updater scripts/verify-host-tuf-publication.py
          scripts/tests/host-publication-e2e.py &&
          python -m ruff format --check apps/api/python apps/api/python_tests
          deploy/rpi/host-updater scripts/verify-host-tuf-publication.py
          scripts/tests/host-publication-e2e.py

      - name: Test with coverage
        run: npm run test:coverage

      - name: Test operational tooling
        run: npm run test:tooling

      - name: Test TP-Link bridge with coverage
        run: npm run test:coverage:python

      - name: Build
        run: npm run build

      - name: Validate Compose configuration
        run: |
          docker compose --profile self-update --profile tapo-history --profile maintenance --profile migration --profile cloudflare config --quiet
          STUGA_HOST_BIND_USER=0:0 STUGA_UPDATE_OPERATIONS_DIRECTORY=stuga-update-operations STUGA_UPDATE_OPERATIONS_MOUNT_OPTIONS=rw docker compose --profile maintenance --profile migration config --quiet

      - name: Build production containers
        run: |
          docker build --target api --tag stugu-api-ci:${{ github.sha }} .
          docker build --target backup --tag stugu-backup-ci:${{ github.sha }} .
          docker build --target web --tag stugu-web-ci:${{ github.sha }} .

      - name: Smoke-test built API on minimum Node.js
        run: npm run smoke:built-api

      - name: Read project version for SonarQube
        id: project-version
        shell: bash
        run: node -e "process.stdout.write('version=' + require('./package.json').version + '\n')" >> "$GITHUB_OUTPUT"

      - name: Detect optional SonarQube credentials
        id: sonar
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [[ -n "$SONAR_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SONAR_TOKEN is not configured; skipping optional SonarQube analysis."
          fi

      - name: SonarQube Cloud analysis and quality gate
        if: steps.sonar.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.projectVersion=${{ steps.project-version.outputs.version }}
