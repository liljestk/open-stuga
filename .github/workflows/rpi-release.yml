name: Raspberry Pi release (manual fallback)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag to rebuild (for example v0.15.0)
        required: true
        type: string
      confirm_hosted_build:
        description: Confirm use of hosted runners for all Linux and Pi images
        required: true
        default: false
        type: boolean
      host_generation:
        description: Monotonic unsigned host generation
        required: true
        type: string
      host_update_base_url:
        description: HTTPS base URL of the production TUF repository
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: rpi-release-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag }}
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  source_bundle:
    name: Publish Nexus433 corresponding source
    if: ${{ inputs.confirm_hosted_build }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the released source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13

      - name: Build and verify corresponding source
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          test "$version" = "$(node -p "require('./package.json').version")"
          node scripts/build-nexus433-source-bundle.mjs \
            --version "$version" \
            --output "$GITHUB_WORKSPACE/dist/source"

      - name: Preserve source before publishing containers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nexus433-corresponding-source-${{ env.RELEASE_TAG }}
          path: |
            dist/source/stugu-nexus433-corresponding-source-*.tar.gz
            dist/source/stugu-nexus433-corresponding-source-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  containers:
    name: Container (${{ matrix.target }})
    needs: source_bundle
    if: ${{ inputs.confirm_hosted_build }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: api
            suffix: api
            dockerfile: Dockerfile
            build_target: api
          - target: web
            suffix: web
            dockerfile: Dockerfile
            build_target: web
          - target: backup
            suffix: backup
            dockerfile: Dockerfile
            build_target: backup
          - target: tapo-export-runner
            suffix: tapo-export-runner
            dockerfile: Dockerfile
            build_target: tapo-export-runner
          - target: update-agent
            suffix: update-agent
            dockerfile: Dockerfile
            build_target: update-agent
          - target: mqtt
            suffix: mqtt
            dockerfile: deploy/mqtt/Dockerfile
            build_target: runtime
          - target: nexus433
            suffix: nexus433
            dockerfile: deploy/nexus433/Dockerfile
            build_target: runtime
    steps:
      - name: Check out the released source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify tag and package version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          test "${RELEASE_TAG#v}" = "$package_version"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ${{ matrix.target }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.build_target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.suffix }}:${{ env.RELEASE_TAG }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          provenance: mode=max
          sbom: true

  resolve_images:
    name: Freeze release image digests
    needs: containers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      api_ref: ${{ steps.images.outputs.api_ref }}
      web_ref: ${{ steps.images.outputs.web_ref }}
      backup_ref: ${{ steps.images.outputs.backup_ref }}
      tapo_ref: ${{ steps.images.outputs.tapo_ref }}
      update_agent_ref: ${{ steps.images.outputs.update_agent_ref }}
      mqtt_ref: ${{ steps.images.outputs.mqtt_ref }}
      nexus433_ref: ${{ steps.images.outputs.nexus433_ref }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable image references
        id: images
        shell: bash
        run: |
          set -euo pipefail
          resolve() {
            local ref="$1"
            local digest
            digest="$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            printf '%s@%s' "$ref" "$digest"
          }
          {
            echo "api_ref=$(resolve "${IMAGE_PREFIX}-api:${RELEASE_TAG}")"
            echo "web_ref=$(resolve "${IMAGE_PREFIX}-web:${RELEASE_TAG}")"
            echo "backup_ref=$(resolve "${IMAGE_PREFIX}-backup:${RELEASE_TAG}")"
            echo "tapo_ref=$(resolve "${IMAGE_PREFIX}-tapo-export-runner:${RELEASE_TAG}")"
            echo "update_agent_ref=$(resolve "${IMAGE_PREFIX}-update-agent:${RELEASE_TAG}")"
            echo "mqtt_ref=$(resolve "${IMAGE_PREFIX}-mqtt:${RELEASE_TAG}")"
            echo "nexus433_ref=$(resolve "${IMAGE_PREFIX}-nexus433:${RELEASE_TAG}")"
          } >> "$GITHUB_OUTPUT"

  ota:
    name: Factory image and host signing inputs
    needs: [resolve_images, source_bundle]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - name: Check out the released source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js for deployment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13

      - name: Check native ARM64 runner capacity
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          df -h "$GITHUB_WORKSPACE"
          docker version

      - name: Build Raspberry Pi factory image and host inputs
        shell: bash
        env:
          STUGA_VERSION: ${{ env.RELEASE_TAG }}
          STUGA_IMAGE_TAG: ${{ env.RELEASE_TAG }}
          STUGA_IMAGE_REGISTRY_PREFIX: ${{ env.IMAGE_PREFIX }}
          STUGA_API_IMAGE: ${{ needs.resolve_images.outputs.api_ref }}
          STUGA_WEB_IMAGE: ${{ needs.resolve_images.outputs.web_ref }}
          STUGA_BACKUP_IMAGE: ${{ needs.resolve_images.outputs.backup_ref }}
          STUGA_TAPO_RUNNER_IMAGE: ${{ needs.resolve_images.outputs.tapo_ref }}
          STUGA_UPDATE_AGENT_IMAGE: ${{ needs.resolve_images.outputs.update_agent_ref }}
          STUGA_MQTT_IMAGE: ${{ needs.resolve_images.outputs.mqtt_ref }}
          STUGA_NEXUS433_IMAGE: ${{ needs.resolve_images.outputs.nexus433_ref }}
          STUGA_HOST_GENERATION: ${{ inputs.host_generation }}
          RPI_HOST_UPDATE_BASE_URL: ${{ inputs.host_update_base_url }}
          RPI_FACTORY_SSH_PUBLIC_KEY: ${{ secrets.RPI_FACTORY_SSH_PUBLIC_KEY }}
          RPI_HOST_TUF_ROOT_JSON: ${{ secrets.RPI_HOST_TUF_ROOT_JSON }}
          RPI_HOST_RAUC_CA_PEM: ${{ secrets.RPI_HOST_RAUC_CA_PEM }}
          RPI_FACTORY_BUILD: "1"
          RPI_EXPORT_FACTORY_IMAGE: "1"
          RPI_IMAGE_GEN_INSTALL_DEPS: "1"
        run: |
          set -Eeuo pipefail
          if [[ ! "$RPI_FACTORY_SSH_PUBLIC_KEY" =~ ^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp[0-9]+)[[:space:]] ]]; then
            echo "::error::RPI_FACTORY_SSH_PUBLIC_KEY must contain a valid SSH public key"
            exit 1
          fi
          test -n "$RPI_HOST_TUF_ROOT_JSON"
          test -n "$RPI_HOST_RAUC_CA_PEM"
          node -e 'const n=Number(process.env.STUGA_HOST_GENERATION); if (!Number.isSafeInteger(n) || n < 1) process.exit(1)'
          [[ "$RPI_HOST_UPDATE_BASE_URL" =~ ^https:// ]]

          ssh_key_path="$RUNNER_TEMP/stugu-appliance.pub"
          tuf_root_path="$RUNNER_TEMP/stugu-host-root.json"
          rauc_ca_path="$RUNNER_TEMP/stugu-host-rauc-ca.pem"
          install -m 0600 /dev/null "$ssh_key_path"
          install -m 0600 /dev/null "$tuf_root_path"
          install -m 0600 /dev/null "$rauc_ca_path"
          printf '%s\n' "$RPI_FACTORY_SSH_PUBLIC_KEY" > "$ssh_key_path"
          printf '%s\n' "$RPI_HOST_TUF_ROOT_JSON" > "$tuf_root_path"
          printf '%s\n' "$RPI_HOST_RAUC_CA_PEM" > "$rauc_ca_path"
          export HOST_UID="$(id -u)"
          export HOST_GID="$(id -g)"

          docker run --rm --privileged --platform linux/arm64 \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$ssh_key_path:/run/secrets/stugu-appliance.pub:ro" \
            --volume "$tuf_root_path:/run/secrets/stugu-host-root.json:ro" \
            --volume "$rauc_ca_path:/run/secrets/stugu-host-rauc-ca.pem:ro" \
            --workdir /workspace \
            --env HOST_UID \
            --env HOST_GID \
            --env STUGA_VERSION \
            --env STUGA_IMAGE_TAG \
            --env STUGA_IMAGE_REGISTRY_PREFIX \
            --env STUGA_API_IMAGE \
            --env STUGA_WEB_IMAGE \
            --env STUGA_BACKUP_IMAGE \
            --env STUGA_TAPO_RUNNER_IMAGE \
            --env STUGA_UPDATE_AGENT_IMAGE \
            --env STUGA_MQTT_IMAGE \
            --env STUGA_NEXUS433_IMAGE \
            --env STUGA_HOST_GENERATION \
            --env RPI_HOST_UPDATE_BASE_URL \
            --env RPI_FACTORY_BUILD \
            --env RPI_EXPORT_FACTORY_IMAGE \
            --env RPI_IMAGE_GEN_INSTALL_DEPS \
            --env RPI_SSH_PUBLIC_KEY_FILE=/run/secrets/stugu-appliance.pub \
            --env RPI_HOST_TUF_ROOT_FILE=/run/secrets/stugu-host-root.json \
            --env RPI_HOST_RAUC_CA_FILE=/run/secrets/stugu-host-rauc-ca.pem \
            debian:trixie-slim@sha256:020c0d20b9880058cbe785a9db107156c3c75c2ac944a6aa7ab59f2add76a7bd \
            bash -c '
              set -Eeuo pipefail
              apt-get update
              apt-get install --yes --no-install-recommends ca-certificates git openssl python3-cryptography python3-tuf zstd
              bash scripts/build-rpi-image.sh
              chown -R "$HOST_UID:$HOST_GID" dist/rpi
            '

          mkdir -p dist/rpi/release dist/rpi/host-inputs
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          import { releaseManifest } from "./scripts/local-release-manifest.mjs";
          const version = process.env.RELEASE_TAG.slice(1);
          const images = {
            api: process.env.STUGA_API_IMAGE,
            web: process.env.STUGA_WEB_IMAGE,
            backup: process.env.STUGA_BACKUP_IMAGE,
            "tapo-export-runner": process.env.STUGA_TAPO_RUNNER_IMAGE,
            "update-agent": process.env.STUGA_UPDATE_AGENT_IMAGE,
            mqtt: process.env.STUGA_MQTT_IMAGE,
            nexus433: process.env.STUGA_NEXUS433_IMAGE,
          };
          const value = releaseManifest(process.env.GITHUB_REPOSITORY, version, process.env.RELEASE_TAG, images);
          const data = `${JSON.stringify(value, null, 2)}\n`;
          writeFileSync("dist/rpi/release/stugu-release-manifest-v1.json", data, { mode: 0o444, flag: "wx" });
          writeFileSync("dist/rpi/host-inputs/stugu-release-manifest-v1.json", data, { mode: 0o444, flag: "wx" });
          NODE

      - name: Download verified corresponding source
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nexus433-corresponding-source-${{ env.RELEASE_TAG }}
          path: dist/rpi

      - name: Locate and checksum release artifacts
        id: ota
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          name="stugu-rpi4-${version}-ota.tar.zst"
          path="$GITHUB_WORKSPACE/dist/rpi/$name"
          checksum_path="$GITHUB_WORKSPACE/dist/rpi/stugu-rpi4-${version}.sha256"
          factory_name="stugu-rpi4-${version}.img.zst"
          factory_path="$GITHUB_WORKSPACE/dist/rpi/$factory_name"
          factory_checksum_path="$GITHUB_WORKSPACE/dist/rpi/stugu-rpi4-${version}-factory.sha256"
          source_name="stugu-nexus433-corresponding-source-${version}.tar.gz"
          source_path="$GITHUB_WORKSPACE/dist/rpi/$source_name"
          source_checksum_path="$source_path.sha256"
          manifest_path="$GITHUB_WORKSPACE/dist/rpi/release/stugu-release-manifest-v1.json"
          test -s "$path"
          test -s "$factory_path"
          test -s "$source_path"
          test -s "$source_checksum_path"
          test -s "$manifest_path"
          (
            cd "$GITHUB_WORKSPACE/dist/rpi"
            sha256sum "$name" > "$(basename "$checksum_path")"
            sha256sum "$factory_name" > "$(basename "$factory_checksum_path")"
          )
          checksum="$(sha256sum "$path" | cut -d ' ' -f 1)"
          {
            echo "version=$version"
            echo "name=$name"
            echo "path=$path"
            echo "checksum_path=$checksum_path"
            echo "checksum=$checksum"
            echo "factory_name=$factory_name"
            echo "factory_path=$factory_path"
            echo "factory_checksum_path=$factory_checksum_path"
            echo "source_path=$source_path"
            echo "source_checksum_path=$source_checksum_path"
            echo "manifest_path=$manifest_path"
            echo "uri=https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$name"
          } >> "$GITHUB_OUTPUT"

      - name: Upload short-lived factory image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stugu-rpi4-${{ steps.ota.outputs.version }}-factory
          path: |
            ${{ steps.ota.outputs.factory_path }}
            ${{ steps.ota.outputs.factory_checksum_path }}
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Upload host inputs for the isolated RAUC signer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stugu-rpi4-${{ steps.ota.outputs.version }}-host-inputs
          path: dist/rpi/host-inputs/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Attach validated factory image to GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            ${{ steps.ota.outputs.factory_path }}
            ${{ steps.ota.outputs.factory_checksum_path }}
            ${{ steps.ota.outputs.source_path }}
            ${{ steps.ota.outputs.source_checksum_path }}
            ${{ steps.ota.outputs.manifest_path }}
          fail_on_unmatched_files: true
          overwrite_files: false
