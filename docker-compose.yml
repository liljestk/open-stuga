services:
  runtime-secrets:
    image: ${STUGA_API_IMAGE:-stugu-api:local}
    build:
      context: .
      target: api
    restart: "no"
    command: ["node", "/app/scripts/init-runtime-secrets.mjs"]
    environment:
      STUGA_TIMESERIES_ADMIN_SECRET_PATH: /app/runtime/admin/password
      STUGA_TIMESERIES_APP_SECRET_PATH: /app/runtime/db/password
      STUGA_PROXY_SECRET_PATH: /app/runtime/proxy/secret
      STUGA_TAPO_WORKER_SECRET_PATH: /app/runtime/tapo/worker-token
    volumes:
      - stuga-timeseries-admin-secret:/app/runtime/admin
      - stuga-timeseries-app-secret:/app/runtime/db
      - stuga-proxy-secret:/app/runtime/proxy
      - stuga-tapo-worker-secret:/app/runtime/tapo
    read_only: true
    security_opt:
      - no-new-privileges:true
    network_mode: none

  backup-operations-init:
    image: ${STUGA_BACKUP_IMAGE:-stugu-backup:local}
    build:
      context: .
      target: backup
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 1000:1000 /app/runtime/backup-operations && chmod 0700 /app/runtime/backup-operations"]
    volumes:
      - stuga-backup-operations:/app/runtime/backup-operations
    read_only: true
    security_opt:
      - no-new-privileges:true
    network_mode: none

  r2-backup-operations-init:
    profiles: ["r2-backup"]
    image: ${STUGA_BACKUP_IMAGE:-stugu-backup:local}
    build:
      context: .
      target: backup
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R ${STUGA_HOST_BIND_USER:-1000:1000} /app/runtime/r2-backup-operations && chmod 0700 /app/runtime/r2-backup-operations"]
    volumes:
      - stuga-r2-backup-operations:/app/runtime/r2-backup-operations
    read_only: true
    security_opt:
      - no-new-privileges:true
    network_mode: none

  update-operations-init:
    image: ${STUGA_API_IMAGE:-stugu-api:local}
    build:
      context: .
      target: api
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown 1000:$${STUGA_UPDATE_OPERATIONS_GID} /app/runtime/update-operations && chmod 2770 /app/runtime/update-operations && find /app/runtime/update-operations -mindepth 1 -maxdepth 1 ! -name host-bridge -exec chown -R 1000:$${STUGA_UPDATE_OPERATIONS_GID} {} +"]
    environment:
      STUGA_UPDATE_OPERATIONS_GID: ${STUGA_UPDATE_OPERATIONS_GID:-1000}
    volumes:
      - ${STUGA_UPDATE_OPERATIONS_DIRECTORY:-./data/update-operations}:/app/runtime/update-operations:${STUGA_UPDATE_OPERATIONS_MOUNT_OPTIONS:-z}
    read_only: true
    security_opt:
      - no-new-privileges:true
    network_mode: none

  timescaledb:
    image: ${TIMESCALE_IMAGE:-timescale/timescaledb:2.28.3-pg17}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TIMESERIES_DATABASE:-stuga}
      POSTGRES_USER: stuga_admin
      POSTGRES_PASSWORD_FILE: /run/stuga-admin/password
      TIMESCALEDB_TELEMETRY: "off"
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=30
      - -c
      # One scheduler plus three concurrent policy jobs bounds Pi background
      # churn; retain four separate parallel-query slots for maintenance.
      - max_worker_processes=8
      - -c
      - max_parallel_workers=4
      - -c
      - timescaledb.max_background_workers=4
      - -c
      - wal_compression=on
      - -c
      - max_wal_size=1GB
      - -c
      - timescaledb.telemetry_level=off
    expose:
      - "5432"
    volumes:
      - ${STUGA_TIMESERIES_DATA_SOURCE:-stuga-timeseries-data}:/var/lib/postgresql/data
      - stuga-timeseries-socket:/var/run/postgresql
      - stuga-timeseries-admin-secret:/run/stuga-admin:ro
      - stuga-timeseries-app-secret:/run/stuga-app:ro
      - ./scripts/bootstrap-timescale.sh:/docker-entrypoint-initdb.d/20-stugu-app-role.sh:ro,z
    depends_on:
      runtime-secrets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  timeseries-credential-reconcile:
    profiles: ["maintenance"]
    image: ${TIMESCALE_IMAGE:-timescale/timescaledb:2.28.3-pg17}
    restart: "no"
    user: postgres
    depends_on:
      runtime-secrets:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy
    command: ["/bin/sh", "/opt/stugu/reconcile-timescale-credentials.sh"]
    environment:
      POSTGRES_DB: ${TIMESERIES_DATABASE:-stuga}
      POSTGRES_USER: stuga_admin
    volumes:
      - stuga-timeseries-socket:/var/run/postgresql
      - stuga-timeseries-admin-secret:/run/stuga-admin:ro
      - stuga-timeseries-app-secret:/run/stuga-app:ro
      - ./scripts/reconcile-timescale-credentials.sh:/opt/stugu/reconcile-timescale-credentials.sh:ro,z
    read_only: true
    security_opt:
      - no-new-privileges:true
    network_mode: none

  source-ingress-secrets:
    profiles: ["mqtt"]
    image: ${STUGA_MQTT_IMAGE:-stugu-mqtt:local}
    build:
      context: .
      dockerfile: deploy/mqtt/Dockerfile
      target: runtime
    restart: "no"
    user: "0:0"
    entrypoint: ["/usr/local/bin/stugu-mqtt-init-secrets"]
    volumes:
      - stuga-source-ingress-broker-secret:/run/source-ingress/broker
      - stuga-source-ingress-publisher-secret:/run/source-ingress/publisher
      - stuga-source-ingress-subscriber-secret:/run/source-ingress/subscriber
    read_only: true
    tmpfs:
      - /tmp:size=1m,mode=0700
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    network_mode: none

  mqtt:
    profiles: ["mqtt"]
    image: ${STUGA_MQTT_IMAGE:-stugu-mqtt:local}
    build:
      context: .
      dockerfile: deploy/mqtt/Dockerfile
      target: runtime
    init: true
    restart: unless-stopped
    depends_on:
      source-ingress-secrets:
        condition: service_completed_successfully
    volumes:
      - stuga-source-ingress-broker-secret:/run/source-ingress/broker:ro
    read_only: true
    tmpfs:
      - /run/mosquitto:size=1m,mode=0700,uid=100,gid=101
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - source-ingress

  nexus433:
    profiles: ["nexus433"]
    image: ${STUGA_NEXUS433_IMAGE:-stugu-nexus433:local}
    build:
      context: .
      dockerfile: deploy/nexus433/Dockerfile
      target: runtime
    init: true
    restart: unless-stopped
    depends_on:
      mqtt:
        condition: service_healthy
    environment:
      NEXUS433_MQTT_HOST: mqtt
      NEXUS433_MQTT_PORT: "1883"
      NEXUS433_MQTT_USER: nexus433
      NEXUS433_MQTT_CLIENT_ID: ${NEXUS433_MQTT_CLIENT_ID:-nexus433}
      NEXUS433_MQTT_PASSWORD_FILE: /run/secrets/source-ingress/password
      NEXUS433_GPIO_CHIP: /dev/gpiochip0
      NEXUS433_GPIO_LINE: ${NEXUS433_GPIO_LINE:-17}
    devices:
      - /dev/gpiochip0:/dev/gpiochip0:rwm
    group_add:
      - ${STUGA_GPIO_GID:-65534}
    volumes:
      - stuga-source-ingress-publisher-secret:/run/secrets/source-ingress:ro
    read_only: true
    tmpfs:
      - /run/nexus433:size=1m,mode=0700,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - source-ingress

  api:
    image: ${STUGA_API_IMAGE:-stugu-api:local}
    build:
      context: .
      target: api
    init: true
    restart: unless-stopped
    depends_on:
      runtime-secrets:
        condition: service_completed_successfully
      backup-operations-init:
        condition: service_completed_successfully
      update-operations-init:
        condition: service_completed_successfully
      timescaledb:
        condition: service_started
    env_file:
      - path: ${STUGA_CLOUDFLARE_ENV_FILE:-./secrets/cloudflare/config.env}
        required: false
    environment:
      PORT: "8787"
      API_HOST: 0.0.0.0
      # Dynamic LAN/Tailnet hosts are authenticated by the bundled proxy.
      # First-owner setup on a non-loopback bind also needs the bootstrap secret.
      LOCAL_AUTH_PROXY_BIND_ADDRESS: ${BIND_ADDRESS:-127.0.0.1}
      LOCAL_AUTH_PROXY_SECRET_FILE: /app/runtime/proxy/secret
      LOCAL_AUTH_BOOTSTRAP_SECRET: ${LOCAL_AUTH_BOOTSTRAP_SECRET:-}
      BUG_REPORT_RELAY_URL: ${BUG_REPORT_RELAY_URL:-}
      BUG_REPORT_RELAY_TOKEN_FILE: /run/secrets/bug-report/relay-token
      DATABASE_PATH: /app/data/climate-twin.sqlite
      STUGBY_IDENTITY_FILE: /app/data/stuguby-identity.json
      STUGBY_NODE_NAME: ${STUGBY_NODE_NAME:-Stugu}
      STUGBY_SYNC_INTERVAL_MS: ${STUGBY_SYNC_INTERVAL_MS:-15000}
      INTEGRATION_SECRETS_FILE: /app/data/integration-secrets.json
      BACKUP_OPERATIONS_DIRECTORY: /app/runtime/backup-operations
      BACKUP_DIRECTORY: /app/backups
      SYSTEM_UPDATE_OPERATIONS_DIRECTORY: /app/runtime/update-operations
      SYSTEM_UPDATE_REPOSITORY: ${SYSTEM_UPDATE_REPOSITORY:-liljestk/open-stuga}
      SYSTEM_UPDATE_IMAGE_PREFIX: ${SYSTEM_UPDATE_IMAGE_PREFIX:-ghcr.io/liljestk/open-stuga}
      STUGA_HOST_CAPABILITIES_FILE: /app/config/host-capabilities.json
      SOURCE_MQTT_HOST: mqtt
      SOURCE_MQTT_PORT: "1883"
      SOURCE_MQTT_USER: stugu-api
      SOURCE_MQTT_PASSWORD_FILE: /run/secrets/source-ingress/password
      CLOUDFLARE_SETUP_DEPLOYMENT_FILE: /run/secrets/cloudflare/deployment.json
      STUGA_CLOUDFLARE_OAUTH_CLIENT_ID: ${STUGA_CLOUDFLARE_OAUTH_CLIENT_ID:-}
      STUGA_LOCAL_UI_PORT: ${APP_PORT:-8080}
      MOCK_ENABLED: ${MOCK_ENABLED:-false}
      MOCK_INTERVAL_MS: ${MOCK_INTERVAL_MS:-2000}
      # Fresh generated configuration sets 30. The fallback remains zero so an
      # older deployment cannot begin pruning merely because it omitted the key.
      RETENTION_DAYS: ${RETENTION_DAYS:-0}
      TIMESERIES_ENABLED: "true"
      # SQLite is the crash-safe local outbox, so ingestion can buffer during a
      # TimeDB outage. Set true only when strict TimeDB startup is preferred.
      TIMESERIES_REQUIRED: ${TIMESERIES_REQUIRED:-false}
      TIMESERIES_HOST: timescaledb
      TIMESERIES_PORT: "5432"
      TIMESERIES_DATABASE: ${TIMESERIES_DATABASE:-stuga}
      TIMESERIES_USER: stuga_app
      TIMESERIES_PASSWORD_FILE: /app/runtime/db/password
      TIMESERIES_SSL_MODE: disable
      TIMESERIES_POOL_MAX: ${TIMESERIES_POOL_MAX:-6}
      TIMESERIES_CONNECT_TIMEOUT_MS: ${TIMESERIES_CONNECT_TIMEOUT_MS:-5000}
      TIMESERIES_STATEMENT_TIMEOUT_MS: ${TIMESERIES_STATEMENT_TIMEOUT_MS:-15000}
      TIMESERIES_BATCH_SIZE: ${TIMESERIES_BATCH_SIZE:-1000}
      TIMESERIES_COLUMNSTORE_AFTER_DAYS: ${TIMESERIES_COLUMNSTORE_AFTER_DAYS:-7}
      TIMESERIES_STORAGE_PATH: /app/timeseries-data
      INGEST_API_KEY: ${INGEST_API_KEY:-}
      HA_URL: ${HA_URL:-}
      HA_TOKEN: ${HA_TOKEN:-}
      HA_ENTITY_MAP_FILE: /app/config/home-assistant.entities.json
      TP_LINK_HOST: ${TP_LINK_HOST:-}
      TP_LINK_USERNAME: ${TP_LINK_USERNAME:-}
      TP_LINK_PASSWORD: ${TP_LINK_PASSWORD:-}
      TP_LINK_DEVICE_MAP_FILE: /app/config/tp-link.devices.json
      TP_LINK_POLL_INTERVAL_MS: ${TP_LINK_POLL_INTERVAL_MS:-2000}
      TP_LINK_CONTACT_POLL_INTERVAL_MS: ${TP_LINK_CONTACT_POLL_INTERVAL_MS:-500}
      TP_LINK_DISCOVERY_TARGETS: ${TP_LINK_DISCOVERY_TARGETS:-}
      GREE_POLL_INTERVAL_MS: ${GREE_POLL_INTERVAL_MS:-60000}
      GREE_DISCOVERY_TARGETS: ${GREE_DISCOVERY_TARGETS:-}
      TAPO_HISTORY_ENABLED: ${TAPO_HISTORY_ENABLED:-false}
      TAPO_HISTORY_WORKER_TOKEN_FILE: /app/runtime/tapo/worker-token
      TAPO_HISTORY_EXPORT_EMAIL: ${TAPO_HISTORY_EXPORT_EMAIL:-}
      TAPO_HISTORY_EMAIL_TAG_PREFIX: ${TAPO_HISTORY_EMAIL_TAG_PREFIX:-stugu}
      TAPO_HISTORY_EXPORT_INTERVAL_MINUTES: ${TAPO_HISTORY_EXPORT_INTERVAL_MINUTES:-15}
      TAPO_HISTORY_MAX_EXPORT_DAYS: ${TAPO_HISTORY_MAX_EXPORT_DAYS:-30}
      TAPO_HISTORY_MAX_PENDING_EMAILS: ${TAPO_HISTORY_MAX_PENDING_EMAILS:-1}
      TAPO_HISTORY_MAILBOX_POLL_INTERVAL_MS: ${TAPO_HISTORY_MAILBOX_POLL_INTERVAL_MS:-60000}
      TAPO_HISTORY_EMAIL_TIMEOUT_MS: ${TAPO_HISTORY_EMAIL_TIMEOUT_MS:-21600000}
      TAPO_HISTORY_WORKER_LEASE_MS: ${TAPO_HISTORY_WORKER_LEASE_MS:-300000}
      TAPO_HISTORY_GMAIL_CLIENT_ID: ${TAPO_HISTORY_GMAIL_CLIENT_ID:-}
      TAPO_HISTORY_GMAIL_ACCOUNT_EMAIL: ${TAPO_HISTORY_GMAIL_ACCOUNT_EMAIL:-}
      TAPO_HISTORY_GMAIL_CLIENT_SECRET_FILE: /run/secrets/tapo-history/gmail-client-secret
      TAPO_HISTORY_GMAIL_REFRESH_TOKEN_FILE: /run/secrets/tapo-history/gmail-refresh-token
      TAPO_HISTORY_PRIVATE_ENDPOINT: ${TAPO_HISTORY_PRIVATE_ENDPOINT:-}
      TAPO_HISTORY_PRIVATE_TOKEN_FILE: /run/secrets/tapo-history/private-endpoint-token
      ALERT_WEBHOOK_DESTINATIONS_JSON: ${ALERT_WEBHOOK_DESTINATIONS_JSON:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_BEARER_TOKEN: ${ALERT_WEBHOOK_BEARER_TOKEN:-}
      ALERT_WEBHOOK_SIGNING_SECRET: ${ALERT_WEBHOOK_SIGNING_SECRET:-}
      ALERT_WEBHOOK_ALLOWED_HOSTS: ${ALERT_WEBHOOK_ALLOWED_HOSTS:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-}
      APNS_PRIVATE_KEY_FILE: ${APNS_PRIVATE_KEY_FILE:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    expose:
      - "8787"
    volumes:
      - climate-twin-data:/app/data
      - ${STUGA_TIMESERIES_DATA_SOURCE:-stuga-timeseries-data}:/app/timeseries-data:ro
      - stuga-timeseries-app-secret:/app/runtime/db:ro
      - stuga-proxy-secret:/app/runtime/proxy:ro
      - stuga-tapo-worker-secret:/app/runtime/tapo:ro
      - stuga-source-ingress-subscriber-secret:/run/secrets/source-ingress:ro
      - stuga-backup-operations:/app/runtime/backup-operations
      - ${STUGA_SCHEDULED_BACKUP_SOURCE:-stuga-scheduled-backups}:/app/backups:ro
      - ${STUGA_UPDATE_OPERATIONS_DIRECTORY:-./data/update-operations}:/app/runtime/update-operations:${STUGA_UPDATE_OPERATIONS_MOUNT_OPTIONS:-z}
      - ${STUGA_CONFIG_DIRECTORY:-./config}:/app/config:ro,z
      - ${TAPO_HISTORY_API_SECRET_DIR:-./secrets/tapo-history-api}:/run/secrets/tapo-history:ro,z
      - ${STUGA_CLOUDFLARE_SECRET_DIR:-./secrets/cloudflare}:/run/secrets/cloudflare:ro,z
      - ${STUGA_APNS_SECRET_DIR:-./secrets/apns}:/run/secrets/apns:ro,z
      - ${STUGA_BUG_REPORT_SECRET_DIR:-./secrets/bug-report}:/run/secrets/bug-report:ro,z
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend
      - backend
      - automation
      - source-ingress

  # This privileged helper is opt-in because access to the Docker socket is
  # equivalent to host administration. On Windows/macOS Docker Desktop, run
  # `npm run update-agent` on the host instead.
  stugu-update-agent:
    profiles: ["self-update"]
    image: ${STUGA_UPDATE_AGENT_IMAGE:-stugu-update-agent:local}
    build:
      context: .
      target: update-agent
    # Its nested Compose client must inherit the same deployment interpolation
    # values, or updates can resolve persistent mounts under the project root.
    env_file:
      - path: ${STUGA_UPDATE_COMPOSE_ENV_FILE:-.env}
        required: false
    init: true
    restart: unless-stopped
    environment:
      STUGA_PROJECT_DIRECTORY: /opt/stugu
      SYSTEM_UPDATE_OPERATIONS_DIRECTORY: /persistent/stugu/update-operations
      STUGA_FACTORY_RELEASE_ENV_FILE: /opt/stugu/release.env
      STUGA_KNOWN_GOOD_RELEASE_ENV_FILE: /persistent/stugu/update-release/known-good-v3.env
      STUGA_RELEASE_ENV_FILE: /persistent/stugu/update-release/release-v3.env
      DOCKER_CONFIG: /persistent/stugu/docker-config
      SYSTEM_UPDATE_REPOSITORY: ${SYSTEM_UPDATE_REPOSITORY:-liljestk/open-stuga}
      SYSTEM_UPDATE_IMAGE_PREFIX: ${SYSTEM_UPDATE_IMAGE_PREFIX:-ghcr.io/liljestk/open-stuga}
      SYSTEM_UPDATE_RUNTIME: ${SYSTEM_UPDATE_RUNTIME:-docker}
      STUGA_COMPOSE_PROJECT_NAME: ${STUGA_COMPOSE_PROJECT_NAME:-stuga}
      # Keep updater-private paths separate from the host paths inherited
      # above. Nested Compose talks to the host daemon and must continue to
      # interpolate STUGA_CLOUDFLARE_SECRET_DIR as a host bind source.
      STUGA_UPDATE_CLOUDFLARE_SECRET_DIR: /persistent/stugu/secrets/cloudflare
      STUGA_UPDATE_PROFILE_ENV_FILE: /persistent/stugu/settings/${STUGA_MIGRATION_ENV_FILENAME:-.env}
      STUGA_HOST_UPDATE_JOURNAL: /persistent/stugu/host-update/journal.json
      STUGA_STORAGE_ALLOWED_ROOTS: ${STUGA_STORAGE_ALLOWED_ROOTS:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/opt/stugu:ro,z
      - ${STUGA_UPDATE_OPERATIONS_DIRECTORY:-./data/update-operations}:/persistent/stugu/update-operations:${STUGA_UPDATE_OPERATIONS_MOUNT_OPTIONS:-z}
      - ${STUGA_UPDATE_RELEASE_DIRECTORY:-./data/update-release}:/persistent/stugu/update-release:z
      - ${STUGA_DOCKER_CONFIG_DIRECTORY:-./data/docker-config}:/persistent/stugu/docker-config:ro,z
      - ${STUGA_MIGRATION_SETTINGS_DIRECTORY:-.}:/persistent/stugu/settings:z
      - ${STUGA_CLOUDFLARE_SECRET_DIR:-./secrets/cloudflare}:/persistent/stugu/secrets/cloudflare:z
      - ${STUGA_HOST_UPDATE_DIRECTORY:-./data/host-update}:/persistent/stugu/host-update:ro,z
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  tapo-export-runner:
    profiles: ["tapo-history"]
    image: ${STUGA_TAPO_RUNNER_IMAGE:-stugu-tapo-export-runner:local}
    build:
      context: .
      target: tapo-export-runner
    init: true
    restart: on-failure
    depends_on:
      api:
        condition: service_healthy
    environment:
      TAPO_RUNNER_ENABLED: ${TAPO_RUNNER_ENABLED:-false}
      STUGA_API_URL: http://api:8787
      TAPO_RUNNER_API_PREFIX: /api/v1/internal/tapo-history
      TAPO_HISTORY_WORKER_TOKEN_FILE: /app/runtime/tapo/worker-token
      TAPO_RUNNER_WORKER_ID: ${TAPO_RUNNER_WORKER_ID:-tapo-android-01}
      TAPO_TARGET_LOCK_ID: ${TAPO_TARGET_LOCK_ID:-}
      TAPO_APPIUM_URL: ${TAPO_APPIUM_URL:-http://host.docker.internal:4723}
      TAPO_APPIUM_CAPABILITIES_JSON: ${TAPO_APPIUM_CAPABILITIES_JSON:-}
      TAPO_APPIUM_LOGS_HARDENED: ${TAPO_APPIUM_LOGS_HARDENED:-false}
      TAPO_APPIUM_VERSION: ${TAPO_APPIUM_VERSION:-}
      TAPO_UIAUTOMATOR2_VERSION: ${TAPO_UIAUTOMATOR2_VERSION:-}
      TAPO_APP_VERSION: ${TAPO_APP_VERSION:-}
      TAPO_DEDICATED_ACCOUNT: ${TAPO_DEDICATED_ACCOUNT:-false}
      TAPO_KEEP_SESSION_ON_SHUTDOWN: ${TAPO_KEEP_SESSION_ON_SHUTDOWN:-true}
      TAPO_APPIUM_SESSION_FILE: /app/data/tapo-appium-session.json
      TAPO_RUNNER_ARTIFACT_DIR: /app/data/artifacts
      TAPO_RUNNER_ARTIFACT_RETENTION_DAYS: ${TAPO_RUNNER_ARTIFACT_RETENTION_DAYS:-30}
      TAPO_RUNNER_FLOW_CONFIG: /app/config/tapo-flow.json
      TAPO_ACCOUNT_EMAIL_FILE: /run/secrets/tapo-history/account-email
      TAPO_ACCOUNT_PASSWORD_FILE: /run/secrets/tapo-history/account-password
      TAPO_ACCOUNT_PROOF_FILE: /run/secrets/tapo-history/account-proof
      TAPO_EXPORT_EMAIL: ${TAPO_HISTORY_EXPORT_EMAIL:-}
      TAPO_RUNNER_POLL_MS: ${TAPO_RUNNER_POLL_MS:-10000}
      TAPO_RUNNER_HEARTBEAT_MS: ${TAPO_RUNNER_HEARTBEAT_MS:-15000}
      TAPO_RUNNER_REQUEST_TIMEOUT_MS: ${TAPO_RUNNER_REQUEST_TIMEOUT_MS:-15000}
      TAPO_ACTION_TIMEOUT_MS: ${TAPO_ACTION_TIMEOUT_MS:-15000}
    volumes:
      - stuga-tapo-runner-data:/app/data
      - stuga-tapo-worker-secret:/app/runtime/tapo:ro
      - ${TAPO_HISTORY_RUNNER_SECRET_DIR:-./secrets/tapo-history-runner}:/run/secrets/tapo-history:ro,z
      # The checked-in example keeps `docker compose config` reproducible while
      # the runner remains disabled. Point TAPO_RUNNER_FLOW_FILE at the
      # installation-specific selector flow before enabling automation.
      - ${TAPO_RUNNER_FLOW_FILE:-./apps/tapo-export-runner/flow.example.json}:/app/config/tapo-flow.json:ro,z
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    networks:
      - automation

  telemetry-migrate:
    profiles: ["maintenance"]
    image: ${STUGA_API_IMAGE:-stugu-api:local}
    build:
      context: .
      target: api
    restart: "no"
    depends_on:
      runtime-secrets:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy
    command:
      - node
      - /app/scripts/migrate-telemetry-to-timescale.mjs
      - --source
      - /app/data/climate-twin.sqlite
    environment:
      DATABASE_PATH: /app/data/climate-twin.sqlite
      TIMESERIES_HOST: timescaledb
      TIMESERIES_PORT: "5432"
      TIMESERIES_DATABASE: ${TIMESERIES_DATABASE:-stuga}
      TIMESERIES_USER: stuga_app
      TIMESERIES_PASSWORD_FILE: /app/runtime/db/password
    volumes:
      - climate-twin-data:/app/data
      - stuga-timeseries-app-secret:/app/runtime/db:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  stugu-backup:
    profiles: ["maintenance"]
    image: ${STUGA_BACKUP_IMAGE:-stugu-backup:local}
    build:
      context: .
      target: backup
    restart: "no"
    user: ${STUGA_HOST_BIND_USER:-1000:1000}
    depends_on:
      runtime-secrets:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy
    command:
      - --database
      - /app/data/climate-twin.sqlite
      - --assets
      - /app/data/assets
      - --spatial-db
      - /app/data/experimental-spatial-layers.sqlite
      - --include-timescale
      - --include-secrets-if-present
      - --secrets-file
      - /app/data/integration-secrets.json
    environment:
      BACKUP_MIN_FREE_BYTES: ${BACKUP_MIN_FREE_BYTES:-1073741824}
      TIMESERIES_HOST: timescaledb
      TIMESERIES_PORT: "5432"
      TIMESERIES_DATABASE: ${TIMESERIES_DATABASE:-stuga}
      TIMESERIES_USER: stuga_app
      TIMESERIES_PASSWORD_FILE: /app/runtime/db/password
      TIMESERIES_ADMIN_USER: stuga_admin
      TIMESERIES_ADMIN_PASSWORD_FILE: /app/runtime/admin/password
      TIMESERIES_SSL_MODE: disable
    volumes:
      - climate-twin-data:/app/data:ro
      - stuga-timeseries-app-secret:/app/runtime/db:ro
      - stuga-timeseries-admin-secret:/app/runtime/admin:ro
      - ${STUGA_BACKUP_DIRECTORY:-./backups}:/app/backups:z
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  stugu-backup-export:
    profiles: ["maintenance"]
    image: ${STUGA_BACKUP_IMAGE:-stugu-backup:local}
    build:
      context: .
      target: backup
    restart: "no"
    user: ${STUGA_HOST_BIND_USER:-1000:1000}
    entrypoint: ["/app/scripts/export-scheduled-backups.sh"]
    volumes:
      - ${STUGA_SCHEDULED_BACKUP_SOURCE:-stuga-scheduled-backups}:/app/scheduled-backups:ro
      - ${STUGA_BACKUP_DIRECTORY:-./backups}:/app/backups:z
    read_only: true
    security_opt:
      - no-new-privileges:true
    network_mode: none

  # Mounted only by a trusted, journaled host-agent request. The agent supplies
  # a generated JSON override with exact long-syntax source/target mounts, so
  # user paths never pass through shell or Compose interpolation.
  stugu-storage-helper:
    profiles: ["maintenance"]
    image: ${STUGA_BACKUP_IMAGE:-stugu-backup:local}
    build:
      context: .
      target: backup
    restart: "no"
    user: "0:0"
    entrypoint: ["node", "/app/scripts/stugu-storage-helper.mjs"]
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    network_mode: none

  stugu-migration:
    profiles: ["migration"]
    image: ${STUGA_BACKUP_IMAGE:-stugu-backup:local}
    build:
      context: .
      target: backup
    restart: "no"
    user: ${STUGA_HOST_BIND_USER:-1000:1000}
    depends_on:
      runtime-secrets:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy
    entrypoint: ["node", "/app/scripts/stugu-migration-target.mjs"]
    environment:
      STUGA_MIGRATION_ROOT: /app/migrations
      STUGA_MIGRATION_HOST_ROOT: ${STUGA_MIGRATION_DIRECTORY:-./data/migrations}
      STUGA_TARGET_DATA_DIRECTORY: /app/data
      STUGA_TARGET_TIMESERIES_DIRECTORY: /app/timeseries-data
      STUGA_TARGET_ENV_FILE: /app/target-settings/${STUGA_MIGRATION_ENV_FILENAME:-.env}
      STUGA_TARGET_CONFIG_DIRECTORY: /app/target-settings/config
      STUGA_TARGET_SECRETS_DIRECTORY: /app/target-settings/secrets
      STUGA_MIGRATION_SEED_RETENTION_DAYS: ${STUGA_MIGRATION_SEED_RETENTION_DAYS:-14}
      STUGA_MIGRATION_MAX_RETAINED_SEEDS: ${STUGA_MIGRATION_MAX_RETAINED_SEEDS:-4}
      TIMESERIES_HOST: timescaledb
      TIMESERIES_PORT: "5432"
      TIMESERIES_DATABASE: ${TIMESERIES_DATABASE:-stuga}
      TIMESERIES_ADMIN_USER: stuga_admin
      TIMESERIES_ADMIN_PASSWORD_FILE: /app/runtime/admin/password
      TIMESERIES_SSL_MODE: disable
    volumes:
      - climate-twin-data:/app/data
      - ${STUGA_TIMESERIES_DATA_SOURCE:-stuga-timeseries-data}:/app/timeseries-data:ro
      - stuga-timeseries-admin-secret:/app/runtime/admin:ro
      - ${STUGA_MIGRATION_DIRECTORY:-./data/migrations}:/app/migrations:z
      - ${STUGA_MIGRATION_SETTINGS_DIRECTORY:-.}:/app/target-settings:z
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  stugu-backup-scheduler:
    image: ${STUGA_BACKUP_IMAGE:-stugu-backup:local}
    build:
      context: .
      target: backup
    init: true
    restart: unless-stopped
    depends_on:
      runtime-secrets:
        condition: service_completed_successfully
      backup-operations-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    entrypoint: ["node", "/app/scripts/stugu-backup-scheduler.mjs"]
    environment:
      BACKUP_OPERATIONS_DIRECTORY: /app/runtime/backup-operations
      BACKUP_DIRECTORY: /app/backups
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_MIN_FREE_BYTES: ${BACKUP_MIN_FREE_BYTES:-1073741824}
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-30}
      BACKUP_STORAGE_TARGET_ID: ${STUGA_SCHEDULED_BACKUP_TARGET_ID:-}
      RESTORE_DRILL_INTERVAL_DAYS: ${RESTORE_DRILL_INTERVAL_DAYS:-30}
      TIMESERIES_HOST: timescaledb
      TIMESERIES_PORT: "5432"
      TIMESERIES_DATABASE: ${TIMESERIES_DATABASE:-stuga}
      TIMESERIES_USER: stuga_app
      TIMESERIES_PASSWORD_FILE: /app/runtime/db/password
      TIMESERIES_ADMIN_USER: stuga_admin
      TIMESERIES_ADMIN_PASSWORD_FILE: /app/runtime/admin/password
      TIMESERIES_SSL_MODE: disable
    volumes:
      - climate-twin-data:/app/data:ro
      - stuga-timeseries-app-secret:/app/runtime/db:ro
      - stuga-timeseries-admin-secret:/app/runtime/admin:ro
      - stuga-backup-operations:/app/runtime/backup-operations
      - ${STUGA_SCHEDULED_BACKUP_SOURCE:-stuga-scheduled-backups}:/app/backups
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  stugu-r2-backup:
    profiles: ["r2-backup"]
    image: ${STUGA_BACKUP_IMAGE:-stugu-backup:local}
    build:
      context: .
      target: backup
    init: true
    restart: unless-stopped
    user: ${STUGA_HOST_BIND_USER:-1000:1000}
    depends_on:
      r2-backup-operations-init:
        condition: service_completed_successfully
      stugu-backup-scheduler:
        condition: service_started
    entrypoint: ["node", "/app/scripts/stugu-r2-backup-scheduler.mjs"]
    environment:
      BACKUP_DIRECTORY: /app/backups
      R2_BACKUP_OPERATIONS_DIRECTORY: /app/runtime/r2-backup-operations
      STUGU_R2_ENDPOINT: ${STUGU_R2_ENDPOINT:-}
      STUGU_R2_BUCKET: ${STUGU_R2_BUCKET:-}
      STUGU_R2_PREFIX: ${STUGU_R2_PREFIX:-stugu}
      STUGU_R2_ACCESS_KEY_ID_FILE: /run/secrets/r2/access-key-id
      STUGU_R2_SECRET_ACCESS_KEY_FILE: /run/secrets/r2/secret-access-key
      STUGU_R2_AGE_RECIPIENT_FILE: /run/secrets/r2/age-recipient
      STUGU_R2_POLL_INTERVAL_SECONDS: ${STUGU_R2_POLL_INTERVAL_SECONDS:-60}
      STUGU_R2_RETRY_INTERVAL_MINUTES: ${STUGU_R2_RETRY_INTERVAL_MINUTES:-15}
      BACKUP_STORAGE_TARGET_ID: ${STUGA_SCHEDULED_BACKUP_TARGET_ID:-}
    volumes:
      - ${STUGA_SCHEDULED_BACKUP_SOURCE:-stuga-scheduled-backups}:/app/backups:ro
      - stuga-r2-backup-operations:/app/runtime/r2-backup-operations
      - ${STUGA_R2_SECRET_DIR:-./secrets/r2}:/run/secrets/r2:ro,z
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "const s=JSON.parse(require('fs').readFileSync('/app/runtime/r2-backup-operations/status.json','utf8'));const age=Date.now()-Date.parse(s.checkedAt);if(!s.schedulerHealthy||!Number.isFinite(age)||age>(s.state==='uploading'?21600000:300000))process.exit(1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - backup-egress

  web:
    image: ${STUGA_WEB_IMAGE:-stugu-web:local}
    build:
      context: .
      target: web
      args:
        VITE_API_BASE_URL: ""
        VITE_SPATIAL_MAX_SAMPLE_AGE_MS: ${VITE_SPATIAL_MAX_SAMPLE_AGE_MS:-900000}
        VITE_SPATIAL_REPLAY_MAX_SAMPLE_AGE_MS: ${VITE_SPATIAL_REPLAY_MAX_SAMPLE_AGE_MS:-5400000}
    init: true
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      LOCAL_AUTH_PROXY_SECRET_FILE: /run/stugu-proxy/secret
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    read_only: true
    volumes:
      - stuga-proxy-secret:/run/stugu-proxy:ro
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend

  cloudflared:
    profiles: ["cloudflare"]
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2026.7.2}
    init: true
    restart: unless-stopped
    # Provisioning and live migration create host-bound secrets as this user
    # with mode 0600. Keep the tunnel unprivileged while allowing it to read
    # the token without weakening the file permissions.
    user: ${STUGA_HOST_BIND_USER:-1000:1000}
    depends_on:
      web:
        condition: service_started
    command:
      - tunnel
      - --no-autoupdate
      - --metrics
      - 0.0.0.0:2000
      - run
      - --token-file
      - /run/secrets/cloudflare/tunnel-token
    volumes:
      - ${STUGA_CLOUDFLARE_SECRET_DIR:-./secrets/cloudflare}:/run/secrets/cloudflare:ro,z
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend

networks:
  frontend:
  backend:
    internal: true
  automation:
  backup-egress:
  source-ingress:
    internal: true

volumes:
  climate-twin-data:
  stuga-timeseries-admin-secret:
  stuga-timeseries-app-secret:
  stuga-proxy-secret:
  stuga-tapo-worker-secret:
  stuga-backup-operations:
  stuga-r2-backup-operations:
  stuga-scheduled-backups:
  stuga-update-operations:
  stuga-timeseries-data:
  stuga-timeseries-socket:
  stuga-tapo-runner-data:
  stuga-source-ingress-broker-secret:
  stuga-source-ingress-publisher-secret:
  stuga-source-ingress-subscriber-secret:
