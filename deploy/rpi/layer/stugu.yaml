# METABEGIN
# X-Env-Layer-Name: stugu-appliance
# X-Env-Layer-Version: 1.0.0
# X-Env-Layer-Category: application
# X-Env-Layer-Desc: Stugu appliance services, persistent Docker state, and
#  pinned release containers for Raspberry Pi 4 USB appliances.
# X-Env-Layer-Requires: docker-debian-trixie,rpi-connect-lite
#
# X-Env-VarRequires: IGconf_sys_apt_keydir
# X-Env-VarRequires-Valid: string
#
# X-Env-VarPrefix: stugu
#
# X-Env-Var-assetdir: ${@SRCROOT}/assets
# X-Env-Var-assetdir-Desc: Staged Stugu appliance assets.
# X-Env-Var-assetdir-Required: y
# X-Env-Var-assetdir-Valid: dir
# X-Env-Var-assetdir-Set: y
#
# X-Env-Var-hostupdaterdir: ${@SRCROOT}/host-updater
# X-Env-Var-hostupdaterdir-Desc: Native signed host updater Python package.
# X-Env-Var-hostupdaterdir-Required: y
# X-Env-Var-hostupdaterdir-Valid: dir
# X-Env-Var-hostupdaterdir-Set: y
#
# X-Env-Var-api_image: ghcr.io/liljestk/open-stuga-api:${IGconf_artefact_version}
# X-Env-Var-api_image-Desc: Immutable API container reference.
# X-Env-Var-api_image-Required: y
# X-Env-Var-api_image-Valid: string
# X-Env-Var-api_image-Set: y
#
# X-Env-Var-web_image: ghcr.io/liljestk/open-stuga-web:${IGconf_artefact_version}
# X-Env-Var-web_image-Desc: Immutable web container reference.
# X-Env-Var-web_image-Required: y
# X-Env-Var-web_image-Valid: string
# X-Env-Var-web_image-Set: y
#
# X-Env-Var-backup_image: ghcr.io/liljestk/open-stuga-backup:${IGconf_artefact_version}
# X-Env-Var-backup_image-Desc: Immutable backup container reference.
# X-Env-Var-backup_image-Required: y
# X-Env-Var-backup_image-Valid: string
# X-Env-Var-backup_image-Set: y
#
# X-Env-Var-tapo_image: ghcr.io/liljestk/open-stuga-tapo-export-runner:${IGconf_artefact_version}
# X-Env-Var-tapo_image-Desc: Immutable optional Tapo worker container reference.
# X-Env-Var-tapo_image-Required: y
# X-Env-Var-tapo_image-Valid: string
# X-Env-Var-tapo_image-Set: y
#
# X-Env-Var-update_agent_image: ghcr.io/liljestk/open-stuga-update-agent:${IGconf_artefact_version}
# X-Env-Var-update_agent_image-Desc: Immutable update coordinator image reference.
# X-Env-Var-update_agent_image-Required: y
# X-Env-Var-update_agent_image-Valid: string
# X-Env-Var-update_agent_image-Set: y
#
# X-Env-Var-mqtt_image: ghcr.io/liljestk/open-stuga-mqtt:${IGconf_artefact_version}
# X-Env-Var-mqtt_image-Desc: Immutable internal MQTT broker image reference.
# X-Env-Var-mqtt_image-Required: y
# X-Env-Var-mqtt_image-Valid: string
# X-Env-Var-mqtt_image-Set: y
#
# X-Env-Var-nexus433_image: ghcr.io/liljestk/open-stuga-nexus433:${IGconf_artefact_version}
# X-Env-Var-nexus433_image-Desc: Immutable optional Nexus433 decoder image reference.
# X-Env-Var-nexus433_image-Required: y
# X-Env-Var-nexus433_image-Valid: string
# X-Env-Var-nexus433_image-Set: y
# METAEND
---
mmdebstrap:
  mirrors:
    - ${IGconf_stugu_assetdir}/tailscale-trixie.sources
  setup-hooks:
    - mkdir -p "$1/usr/share/keyrings"
    - curl -fsSL https://pkgs.tailscale.com/stable/debian/trixie.noarmor.gpg -o "$1/usr/share/keyrings/tailscale-archive-keyring.gpg"
    - chmod 0644 "$1/usr/share/keyrings/tailscale-archive-keyring.gpg"
    - cp -p "$1/usr/share/keyrings/tailscale-archive-keyring.gpg" "$IGconf_sys_apt_keydir"
  packages:
    - ca-certificates
    - cloud-guest-utils
    - curl
    - gdisk
    - iproute2
    - nano
    - python3
    - python3-cryptography
    - python3-tuf
    - rauc
    - rauc-service
    - squashfs-tools
    - systemd-timesyncd
    - tailscale
    - u-boot-rpi
    - u-boot-tools
  customize-hooks:
    - |-
      set -eu

      install -d -m 0755 "$1/opt/stugu/config"
      install -d -m 0755 "$1/opt/stugu/scripts"
      install -d -m 0755 "$1/opt/stugu/apps/tapo-export-runner"
      install -d -m 0755 "$1/usr/local/sbin"
      install -d -m 0755 "$1/usr/local/bin"
      install -d -m 0755 "$1/usr/lib/tmpfiles.d"
      install -d -m 0755 "$1/usr/lib/sysusers.d"
      install -d -m 0755 "$1/usr/lib/stugu-host-updater"
      install -d -m 0755 "$1/usr/share/stugu-host-updater"
      install -d -m 0755 "$1/etc/rauc"
      install -d -m 0755 "$1/etc/stugu-host-update"
      install -d -m 0755 "$1/etc/systemd/system"
      install -d -m 0755 "$1/etc/systemd/system.conf.d"
      install -d -m 0755 "$1/etc/systemd/system/containerd.service.d"
      install -d -m 0755 "$1/etc/systemd/system/docker.service.d"
      install -d -m 0755 "$1/etc/systemd/system/bootfs.mount.d"
      install -d -m 0755 "$1/etc/systemd/system/persistent-shared-init.service.d"
      install -d -m 0755 "$1/etc/systemd/system/ssh.service.d"
      install -d -m 0755 "$1/etc/systemd/system/systemd-networkd-wait-online.service.d"
      install -d -m 0755 "$1/etc/systemd/system/tailscaled.service.d"
      install -d -m 0755 "$1/etc/systemd/timesyncd.conf.d"
      install -d -m 0755 "$1/etc/initramfs-tools/hooks"
      install -d -m 0755 "$1/etc/initramfs-tools/scripts/local-block"
      install -d -m 0755 "$1/etc/initramfs-tools/scripts/local-bottom"
      install -d -m 0755 "$1/etc/initramfs-tools/scripts/local-premount"
      install -d -m 0755 "$1/etc/udev/rules.d"
      install -d -m 0755 "$1/etc/rpi-image-gen/slot-shared.d"
      install -d -m 0755 "$1/etc/sudoers.d"

      install -m 0644 "${IGconf_stugu_assetdir}/docker-compose.yml" \
        "$1/opt/stugu/docker-compose.yml"
      install -m 0644 "${IGconf_stugu_assetdir}/stugu.env.example" \
        "$1/opt/stugu/stugu.env.example"
      install -m 0644 "${IGconf_stugu_assetdir}/full.env.example" \
        "$1/opt/stugu/full.env.example"
      install -m 0644 "${IGconf_stugu_assetdir}/tapo-flow.example.json" \
        "$1/opt/stugu/apps/tapo-export-runner/flow.example.json"
      cp -a "${IGconf_stugu_assetdir}/config/." "$1/opt/stugu/config/"
      install -m 0755 "${IGconf_stugu_assetdir}/bootstrap-timescale.sh" \
        "$1/opt/stugu/scripts/bootstrap-timescale.sh"
      install -m 0755 "${IGconf_stugu_assetdir}/reconcile-timescale-credentials.sh" \
        "$1/opt/stugu/scripts/reconcile-timescale-credentials.sh"

      install -m 0755 "${IGconf_stugu_assetdir}/stugu-compose-start" \
        "$1/usr/local/sbin/stugu-compose-start"
      install -m 0755 "${IGconf_stugu_assetdir}/stugu-grow-persistent" \
        "$1/usr/local/sbin/stugu-grow-persistent"
      install -m 0755 "${IGconf_stugu_assetdir}/stugu-usb-bootdev" \
        "$1/usr/bin/stugu-usb-bootdev"
      install -m 0755 "${IGconf_stugu_assetdir}/stugu-usb-udev-slot" \
        "$1/usr/bin/stugu-usb-udev-slot"
      install -m 0644 "${IGconf_stugu_assetdir}/99-rpi-00-stugu-usb.rules" \
        "$1/etc/udev/rules.d/99-rpi-00-stugu-usb.rules"
      install -m 0644 "${IGconf_stugu_assetdir}/70-stugu-gpio.rules" \
        "$1/etc/udev/rules.d/70-stugu-gpio.rules"
      install -m 0755 "${IGconf_stugu_assetdir}/stugu-usb-initramfs-hook" \
        "$1/etc/initramfs-tools/hooks/stugu-usb-bootdev"
      install -m 0755 "${IGconf_stugu_assetdir}/stugu-usb-ab-root" \
        "$1/etc/initramfs-tools/scripts/local-block/20-stugu-usb-ab-root"
      install -m 0755 "${IGconf_stugu_assetdir}/stugu-usb-udev-root" \
        "$1/etc/initramfs-tools/scripts/local-bottom/20-stugu-usb-udev-root"
      install -m 0755 "${IGconf_stugu_assetdir}/stugu-usb-ab-root" \
        "$1/etc/initramfs-tools/scripts/local-premount/20-stugu-usb-ab-root"
      install -m 0755 "${IGconf_stugu_assetdir}/rpi-slot-tryboot" \
        "$1/usr/bin/rpi-slot-tryboot"
      install -m 0755 "${IGconf_stugu_assetdir}/rpi-persistent-shared-init" \
        "$1/usr/local/sbin/stugu-persistent-shared-init"
      install -m 0755 "${IGconf_stugu_assetdir}/stugu-init-ssh-host-keys" \
        "$1/usr/local/sbin/stugu-init-ssh-host-keys"
      install -m 0755 "${IGconf_stugu_assetdir}/stugu-eeprom-compat" \
        "$1/usr/local/sbin/stugu-eeprom-compat"
      install -m 0755 "${IGconf_stugu_assetdir}/stuguctl" \
        "$1/usr/local/bin/stuguctl"
      install -m 0755 "${IGconf_stugu_assetdir}/stugu-boot-select" \
        "$1/usr/bin/stugu-boot-select"
      cp -a "${IGconf_stugu_hostupdaterdir}/stugu_host_updater" \
        "$1/usr/lib/stugu-host-updater/"
      find "$1/usr/lib/stugu-host-updater/stugu_host_updater" \
        -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
      find "$1/usr/lib/stugu-host-updater/stugu_host_updater" \
        -depth -type d -name __pycache__ -exec rm -rf -- {} +
      find "$1/usr/lib/stugu-host-updater/stugu_host_updater" -type d -exec chmod 0755 {} +
      find "$1/usr/lib/stugu-host-updater/stugu_host_updater" -type f -exec chmod 0644 {} +
      install -m 0755 "${IGconf_stugu_assetdir}/stugu-host-updated" \
        "$1/usr/sbin/stugu-host-updated"
      install -m 0755 "${IGconf_stugu_assetdir}/stugu-host-bootstrap" \
        "$1/usr/sbin/stugu-host-bootstrap"
      install -m 0755 "${IGconf_stugu_assetdir}/stugu-host-update" \
        "$1/usr/bin/stugu-host-update"
      install -m 0755 "${IGconf_stugu_assetdir}/stugu-host-update-bridge" \
        "$1/usr/bin/stugu-host-update-bridge"
      install -m 0755 "${IGconf_stugu_assetdir}/stugu-rauc-boot" \
        "$1/usr/lib/stugu-host-updater/stugu-rauc-boot"
      install -m 0644 "${IGconf_stugu_assetdir}/stugu-host-updater-config.json" \
        "$1/etc/stugu-host-update/config.json"
      install -m 0444 "${IGconf_stugu_assetdir}/stugu-host-tuf-root.json" \
        "$1/usr/share/stugu-host-updater/tuf-root.json"
      install -m 0444 "${IGconf_stugu_assetdir}/stugu-host-rauc-ca.pem" \
        "$1/usr/share/stugu-host-updater/rauc-ca.pem"
      install -m 0444 "${IGconf_stugu_assetdir}/stugu-hardware-qualification.json" \
        "$1/usr/share/stugu-host-updater/hardware-qualification.json"
      install -m 0444 "${IGconf_stugu_assetdir}/stugu-host-generation" \
        "$1/etc/stugu-host-generation"
      install -m 0644 "${IGconf_stugu_assetdir}/stugu-rauc-system.conf" \
        "$1/etc/rauc/system.conf"
      install -m 0644 "${IGconf_stugu_assetdir}/stugu-host-updated.service" \
        "$1/etc/systemd/system/stugu-host-updated.service"
      install -m 0644 "${IGconf_stugu_assetdir}/stugu-host-bootstrap.service" \
        "$1/etc/systemd/system/stugu-host-bootstrap.service"
      install -m 0644 "${IGconf_stugu_assetdir}/stugu-host-update-reconcile.service" \
        "$1/etc/systemd/system/stugu-host-update-reconcile.service"
      install -m 0644 "${IGconf_stugu_assetdir}/stugu-host-update-bridge.service" \
        "$1/etc/systemd/system/stugu-host-update-bridge.service"
      install -m 0644 "${IGconf_stugu_assetdir}/stugu-host-update-bridge.sysusers.conf" \
        "$1/usr/lib/sysusers.d/stugu-host-update-bridge.conf"
      # The shipped EROFS root is immutable and already current, so the
      # boot-time ConditionNeedsUpdate gate will not create release-added
      # accounts. Materialize the bridge identity while the image root is
      # still writable.
      systemd-sysusers --root="$1" stugu-host-update-bridge.conf
      install -m 0644 "${IGconf_stugu_assetdir}/stugu-host-update-tmpfiles.conf" \
        "$1/usr/lib/tmpfiles.d/stugu-host-update.conf"
      install -m 0644 "${IGconf_stugu_assetdir}/stugu-system-watchdog.conf" \
        "$1/etc/systemd/system.conf.d/stugu-watchdog.conf"
      install -m 0644 "${IGconf_stugu_assetdir}/stugu-bootfs-read-only.conf" \
        "$1/etc/systemd/system/bootfs.mount.d/stugu-read-only.conf"
      install -m 0644 "${IGconf_stugu_assetdir}/stugu-lock.conf" \
        "$1/usr/lib/tmpfiles.d/stugu-lock.conf"
      install -m 0644 "${IGconf_stugu_assetdir}/stugu.service" \
        "$1/etc/systemd/system/stugu.service"
      install -m 0644 "${IGconf_stugu_assetdir}/stugu-data-grow.service" \
        "$1/etc/systemd/system/stugu-data-grow.service"
      install -m 0644 "${IGconf_stugu_assetdir}/stugu-eeprom-compat.service" \
        "$1/etc/systemd/system/stugu-eeprom-compat.service"
      install -m 0644 "${IGconf_stugu_assetdir}/stugu-timesyncd.conf" \
        "$1/etc/systemd/timesyncd.conf.d/stugu.conf"

      # An image must never carry an SSH server identity that clones inherit.
      # The persistent initializer generates fresh keys on each first boot.
      find "$1/etc/ssh" -maxdepth 1 -type f -name 'ssh_host_*' -delete

      # The Pi 4 USB rescue path boots this FAT payload directly. Keep the
      # firmware's automatic kernel/initramfs pairing: explicit late [pi4]
      # overrides produced repeatable seven-flash failures on the target SSD.
      grep -qx 'auto_initramfs=1' "$1/boot/firmware/config.txt"

      # USB storage discovery races initramfs on the target StoreJet bridge.
      # An explicit delay replaces the accidental delay previously supplied by
      # diagnostic netconsole setup. Enable cgroup-v2 memory accounting after
      # the Pi DTB's earlier cgroup_disable=memory default so Docker limits,
      # metrics, and TimescaleDB first-boot tuning work.
      cmdline="$1/boot/firmware/cmdline.txt"
      [ "$(wc -l < "$cmdline")" -eq 1 ]
      grep -qw 'rootwait' "$cmdline"
      ! grep -Eq '(^|[[:space:]])rootdelay=' "$cmdline"
      ! grep -Eq '(^|[[:space:]])cgroup_enable=memory([[:space:]]|$)' "$cmdline"
      sed -i 's/$/ rootdelay=6 cgroup_enable=memory/' "$cmdline"
      grep -Eqw 'rootdelay=6' "$cmdline"
      grep -Eqw 'cgroup_enable=memory' "$cmdline"

      # initramfs-tools 0.148.4+rpt2 emits compressed modules as a leading,
      # uncompressed CPIO followed by zstd. The target Pi 4/USB-SATA bridge
      # reaches the firmware's seven-flash failure with that layout, while the
      # same files in one zstd stream boot reliably. Patch the immutable build
      # root before rpi-image-gen's final update-initramfs pass. The helper
      # fails closed if the upstream implementation changes.
      python3 "${IGconf_stugu_assetdir}/patch-initramfs-tools-monolithic.py" \
        "$1/usr/sbin/mkinitramfs"

      cat > "$1/etc/systemd/system/systemd-networkd-wait-online.service.d/stugu-any-uplink.conf" <<-'EOF'
      [Service]
      ExecStart=
      ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --any --interface=eth0 --interface=wlan0 --timeout=30
      EOF
      chmod 0644 "$1/etc/systemd/system/systemd-networkd-wait-online.service.d/stugu-any-uplink.conf"

      cat > "$1/etc/default/rpi-eeprom-update" <<-'EOF'
      FIRMWARE_RELEASE_STATUS="default"
      BOOTFS="/bootfs"
      EOF
      chmod 0644 "$1/etc/default/rpi-eeprom-update"
      # EEPROM has no redundant bank. Ordinary appliance startup must never
      # schedule a write; recovery-class local maintenance owns that risk.
      ln -sf /dev/null "$1/etc/systemd/system/rpi-eeprom-update.service"

      cat > "$1/opt/stugu/release.env" <<-EOF
      STUGA_RELEASE_ENV_SCHEMA=3
      STUGA_UPDATE_AGENT_CONTRACT=3
      STUGA_COMPOSE_CONTRACT=2
      STUGA_VERSION=${IGconf_artefact_version}
      STUGA_API_IMAGE=${IGconf_stugu_api_image}
      STUGA_WEB_IMAGE=${IGconf_stugu_web_image}
      STUGA_BACKUP_IMAGE=${IGconf_stugu_backup_image}
      STUGA_TAPO_RUNNER_IMAGE=${IGconf_stugu_tapo_image}
      STUGA_UPDATE_AGENT_IMAGE=${IGconf_stugu_update_agent_image}
      STUGA_MQTT_IMAGE=${IGconf_stugu_mqtt_image}
      STUGA_NEXUS433_IMAGE=${IGconf_stugu_nexus433_image}
      EOF
      chmod 0444 "$1/opt/stugu/release.env"

      printf '%s\n' "${IGconf_artefact_version}" > "$1/etc/stugu-version"
      chmod 0444 "$1/etc/stugu-version"

      cat > "$1/etc/rpi-image-gen/slot-shared.d/stugu.conf" <<-'EOF'
      Version=1
      Path=/etc/ssh
      Path=/var/lib/docker
      Path=/var/lib/containerd
      Path=/var/lib/tailscale
      EOF
      chmod 0644 "$1/etc/rpi-image-gen/slot-shared.d/stugu.conf"

      # The pinned image-rota generator emits both mount units but currently
      # enables only its final generated unit. Pull both mounts directly into
      # the container services so Docker state is always shared across slots.
      cat > "$1/etc/systemd/system/containerd.service.d/stugu-shared-storage.conf" <<-'EOF'
      [Unit]
      Requires=stugu-data-grow.service var-lib-containerd.mount
      After=stugu-data-grow.service var-lib-containerd.mount
      EOF
      chmod 0644 "$1/etc/systemd/system/containerd.service.d/stugu-shared-storage.conf"

      cat > "$1/etc/systemd/system/docker.service.d/stugu-shared-storage.conf" <<-'EOF'
      [Unit]
      Requires=stugu-data-grow.service var-lib-docker.mount var-lib-containerd.mount
      After=stugu-data-grow.service var-lib-docker.mount var-lib-containerd.mount
      EOF
      chmod 0644 "$1/etc/systemd/system/docker.service.d/stugu-shared-storage.conf"

      cat > "$1/etc/systemd/system/tailscaled.service.d/stugu-shared-storage.conf" <<-'EOF'
      [Unit]
      Requires=stugu-data-grow.service var-lib-tailscale.mount
      After=stugu-data-grow.service var-lib-tailscale.mount
      EOF
      chmod 0644 "$1/etc/systemd/system/tailscaled.service.d/stugu-shared-storage.conf"

      cat > "$1/etc/systemd/system/ssh.service.d/stugu-host-keys.conf" <<-'EOF'
      [Unit]
      Requires=etc-ssh.mount
      After=etc-ssh.mount
      EOF
      chmod 0644 "$1/etc/systemd/system/ssh.service.d/stugu-host-keys.conf"

      # image-rota installs its stock initializer after layer customization.
      # Override its command with Stugu's release-aware, idempotent seeder.
      cat > "$1/etc/systemd/system/persistent-shared-init.service.d/stugu.conf" <<-'EOF'
      [Service]
      ExecStart=
      ExecStart=/usr/local/sbin/stugu-persistent-shared-init
      ExecStartPost=/usr/local/sbin/stugu-init-ssh-host-keys
      EOF
      chmod 0644 "$1/etc/systemd/system/persistent-shared-init.service.d/stugu.conf"

      cat > "$1/etc/sudoers.d/020_stuguctl" <<-EOF
      ${IGconf_device_user1} ALL=(root) NOPASSWD: /usr/bin/systemctl start stugu.service
      ${IGconf_device_user1} ALL=(root) NOPASSWD: /usr/bin/systemctl stop stugu.service
      ${IGconf_device_user1} ALL=(root) NOPASSWD: /usr/bin/systemctl restart stugu.service
      ${IGconf_device_user1} ALL=(root) NOPASSWD: /usr/bin/systemctl reboot
      ${IGconf_device_user1} ALL=(root) NOPASSWD: /usr/bin/systemctl poweroff
      ${IGconf_device_user1} ALL=(root) NOPASSWD: /usr/bin/tailscale up --operator=${IGconf_device_user1}
      EOF
      chmod 0440 "$1/etc/sudoers.d/020_stuguctl"
    - $BDEBSTRAP_HOOKS/enable-units "$1" tailscaled stugu-data-grow stugu-eeprom-compat stugu stugu-host-bootstrap stugu-host-updated stugu-host-update-reconcile stugu-host-update-bridge systemd-timesyncd
