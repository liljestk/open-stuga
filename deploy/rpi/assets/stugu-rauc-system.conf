[system]
compatible=stugu-rpi4-usb:stugu-gpt-ab-v2:arm64
bootloader=custom
activate-installed=false
bundle-formats=-plain
data-directory=/persistent/stugu/rauc

[keyring]
path=/usr/share/stugu-host-updater/rauc-ca.pem
check-purpose=codesign

[handlers]
bootloader-custom-backend=/usr/lib/stugu-host-updater/stugu-rauc-boot

[slot.rootfs.0]
device=/dev/disk/by-slot/a/system
type=raw
bootname=a

[slot.rootfs.1]
device=/dev/disk/by-slot/b/system
type=raw
bootname=b

[slot.boot.0]
device=/dev/disk/by-slot/a/boot
type=raw
parent=rootfs.0

[slot.boot.1]
device=/dev/disk/by-slot/b/boot
type=raw
parent=rootfs.1
