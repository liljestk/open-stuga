listener 1883
protocol mqtt

allow_anonymous false
password_file /run/source-ingress/broker/passwords
acl_file /run/source-ingress/broker/acl

persistence false
autosave_interval 0
retain_available true

max_packet_size 4096
message_size_limit 2048
max_queued_messages 100
max_inflight_messages 20

connection_messages true
log_dest stdout
log_type error
log_type warning
log_type notice
