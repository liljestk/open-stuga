name: Stugu

options:
  bundleIdPrefix: net.nysta
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.52.8"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    SWIFT_STRICT_CONCURRENCY: targeted

targets:
  Stugu:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Stugu
        excludes:
          - Info.plist
          - Stugu.entitlements
      - path: Sources/StuguCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.nysta.stuga
        PRODUCT_NAME: Stugu
        INFOPLIST_FILE: Stugu/Info.plist
        CODE_SIGN_ENTITLEMENTS: Stugu/Stugu.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
      configs:
        Debug:
          APNS_ENVIRONMENT: development
        Release:
          APNS_ENVIRONMENT: production
    dependencies:
      - target: StuguWidget
        embed: true
        platformFilter: iOS
      - target: StuguWatch
        embed: true
        platformFilter: iOS
        copy:
          destination: productsDirectory
          subpath: "$(CONTENTS_FOLDER_PATH)/Watch"

  StuguWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: StuguWidget
        excludes:
          - Info.plist
          - StuguWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.nysta.stuga.widget
        PRODUCT_NAME: StuguWidget
        INFOPLIST_FILE: StuguWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: StuguWidget/StuguWidget.entitlements
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"

  StuguWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: StuguWatch
        excludes:
          - Info.plist
      - path: Sources/StuguCore/WatchModels.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.nysta.stuga.watchkitapp
        PRODUCT_NAME: StuguWatch
        INFOPLIST_FILE: StuguWatch/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
