name: Stuga

options:
  bundleIdPrefix: net.nysta
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.13.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_STRICT_CONCURRENCY: targeted

targets:
  Stuga:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Stuga
        excludes:
          - Info.plist
          - Stuga.entitlements
      - path: Sources/StugaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.nysta.stuga
        PRODUCT_NAME: Stuga
        INFOPLIST_FILE: Stuga/Info.plist
        CODE_SIGN_ENTITLEMENTS: Stuga/Stuga.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
      configs:
        Debug:
          APNS_ENVIRONMENT: development
        Release:
          APNS_ENVIRONMENT: production
    dependencies:
      - target: StugaWidget
        embed: true
        platformFilter: iOS
      - target: StugaWatch
        embed: true
        platformFilter: iOS
        copy:
          destination: plugins

  StugaWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: StugaWidget
        excludes:
          - Info.plist
          - StugaWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.nysta.stuga.widget
        PRODUCT_NAME: StugaWidget
        INFOPLIST_FILE: StugaWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: StugaWidget/StugaWidget.entitlements
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"

  StugaWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: StugaWatch
        excludes:
          - Info.plist
      - path: Sources/StugaCore/WatchModels.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.nysta.stuga.watchkitapp
        PRODUCT_NAME: StugaWatch
        INFOPLIST_FILE: StugaWatch/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
